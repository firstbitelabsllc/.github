# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# This file applies to THIS repository. See docs/code-review.md for org rollout.
# Reviews are advisory (2026-10-17): chill profile, no change requests, no failing commit status.
language: en-US
inheritance: true
tone_instructions: >-
  Be concise and evidence-led. Prioritize correctness, security, regressions,
  and missing verification. Give file/line evidence and a concrete fix. Respect
  repository-specific local-first workflows; avoid cosmetic churn.
reviews:
  profile: quiet
  request_changes_workflow: false
  allow_author_approval: false
  high_level_summary: false
  high_level_summary_instructions: >-
    Explain the behavior change, affected components, compatibility risks, and
    validation reported in the PR. Clearly distinguish reported proof from
    checks you actually observed; never invent a successful test run.
  review_status: true
  review_details: true
  fail_commit_status: false
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  suggested_reviewers: false
  enable_prompt_for_ai_agents: false
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Batch fixes; resume deliberately instead of exhausting the trial in a loop.
    auto_pause_after_reviewed_commits: 5
  slop_detection:
    enabled: true
    include_all_authors: true
  path_instructions:
    - path: "**/*"
      instructions: >-
        Follow applicable repository AGENTS.md, REVIEW.md, and contributor rules.
        Prioritize reproducible defects, trust boundaries, data loss, compatibility,
        and missing behavior coverage. Report uncertainty explicitly. Do not treat
        an AI review or a PR author's claim as proof that tests ran.
    - path: ".github/workflows/**"
      instructions: >-
        Check event duplication, job permissions, untrusted PR input, secret
        exposure, action pinning, concurrency, and artifact retention. Never
        suggest replacing deterministic tests with AI review or moving privileged
        jobs to PR contexts.
    - path: "**/*.{test,spec}.{js,jsx,ts,tsx}"
      instructions: >-
        Prefer behavior and regression tests over implementation mirrors. Check
        isolation, deterministic inputs, failure paths, and async cleanup.
    - path: "**/*.swift"
      instructions: >-
        Check actor isolation, main-thread UI work, cancellation, ownership cycles,
        and supported OS/API availability.
    - path: "**/*.md"
      instructions: >-
        Verify commands, paths, feature availability, and links against the code
        and cited source. Distinguish configured capabilities from activated
        services, trial entitlements, completed tests, and deployment receipts.
  pre_merge_checks:
    # One custom check covers explanation quality; avoid duplicate warnings
    # and skipped issue checks presented as successful verification.
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: Explain the change and its proof
        mode: warning
        instructions: >-
          Compare the title and description with the diff. Warn if a reader
          cannot identify the problem, changed behavior, or consequential design
          choice without chat history. Establish scope from the PR changed files
          or merge-base-to-head diff; exclude changes only on a newer base.
          If scope is unavailable, report inconclusive. Checks must name what was exercised and
          preserve mocks, qualifying conditions, and material untested risks.
          Distinguish reported results from checks you observed. Give a specific
          correction; preserve detailed evidence behind links or disclosures.
          Accept any readable format. Suggest a before/after capture, table, or
          Mermaid only when it clarifies this change; missing media is not itself
          a defect. Do not invent tests, require a word count,
          or rewrite the body. Report inconclusive when evidence is insufficient.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
knowledge_base:
  automatic_linking_mode: disabled
  code_guidelines:
    enabled: true
    filePatterns:
      - README.md
      - SECURITY.md
      - docs/code-review.md
      - docs/verification-loop.md
      - "**/AGENTS.md"
      - "**/REVIEW.md"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
chat:
  auto_reply: false
  art: false
